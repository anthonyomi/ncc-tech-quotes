<style>
/* Layout: two-panel desk — the input "channel strip" on the left, the finished quote on the right; stacks on phones. */
:root {
  --bg: #eef1f5;
  --panel: #ffffff;
  --ink: #17202c;
  --muted: #5b6676;
  --line: #d7dde6;
  --accent: #1a4fc4;
  --accent-ink: #ffffff;
  --accent-soft: #e3ebfb;
  --live: #d0141e;
  --ok: #1f7a4d;
  --msg-bg: #f6f8fb;
  --font-display: "Familjen Grotesk", "Helvetica Neue", Arial, sans-serif;
  --font-body: "Figtree", "Segoe UI", system-ui, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f141b; --panel: #171e28; --ink: #e8edf4; --muted: #96a2b3; --line: #2a3442;
    --accent: #6f9bff; --accent-ink: #0c1220; --accent-soft: #1b2a4d; --live: #ff5a5f; --ok: #4fc28a; --msg-bg: #121821;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f141b; --panel: #171e28; --ink: #e8edf4; --muted: #96a2b3; --line: #2a3442;
  --accent: #6f9bff; --accent-ink: #0c1220; --accent-soft: #1b2a4d; --live: #ff5a5f; --ok: #4fc28a; --msg-bg: #121821;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 15px;
  line-height: 1.5;
}
.wrap {
  max-width: 1120px;
  margin: 0 auto;
  padding-block: 28px 48px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: grid;
  gap: 24px;
}
header { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 12px; }
.eyebrow {
  font-family: var(--font-mono); font-size: 12px; letter-spacing: .08em; text-transform: uppercase;
  color: var(--muted); display: flex; align-items: center; gap: 8px;
}
.eyebrow .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--live); box-shadow: 0 0 0 3px color-mix(in srgb, var(--live) 22%, transparent); }
h1 { font-family: var(--font-display); font-size: clamp(26px, 4vw, 36px); line-height: 1.1; margin: 6px 0 0; text-wrap: balance; letter-spacing: -.01em; }
.brand { display: flex; align-items: center; gap: 16px; min-width: 0; }
.logo { width: 72px; height: 72px; border-radius: 50%; flex: none; background: #fff; box-shadow: 0 0 0 1px var(--line), 0 4px 14px color-mix(in srgb, var(--accent) 25%, transparent); }
@media (max-width: 420px) { .logo { width: 56px; height: 56px; } }
.rate-note { font-family: var(--font-mono); font-size: 13px; color: var(--muted); }

.grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.1fr); gap: 24px; align-items: start; }
@media (max-width: 860px) { .grid { grid-template-columns: minmax(0, 1fr); } }

.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 22px; display: grid; gap: 20px; min-width: 0; }
.panel h2 { font-family: var(--font-display); font-size: 18px; margin: 0; }
.section-label { font-family: var(--font-mono); font-size: 11.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 0 0 8px; }

.fields { display: grid; gap: 14px; }
.row { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
@media (max-width: 480px) { .row { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); } .row .f-date { grid-column: 1 / -1; } }
label.f { display: grid; gap: 5px; font-weight: 500; font-size: 13.5px; min-width: 0; }
label.f .hint { font-weight: 400; color: var(--muted); }
input[type="text"], input[type="date"], input[type="time"], input[type="number"] {
  font: inherit; font-size: 15px; color: var(--ink); background: var(--bg);
  border: 1px solid var(--line); border-radius: 9px; padding: 10px 12px; width: 100%; min-width: 0;
}
input:focus-visible, button:focus-visible, .chip input:focus-visible + span {
  outline: 2px solid var(--accent); outline-offset: 2px;
}
.err { color: var(--live); font-size: 13px; margin: 0; }

.roles { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
@media (max-width: 420px) { .roles { grid-template-columns: minmax(0, 1fr); } }
.check {
  display: flex; align-items: center; gap: 12px; cursor: pointer; padding: 12px 14px;
  border: 1px solid var(--line); border-radius: 10px; background: var(--bg); transition: border-color .15s, background .15s;
}
.check:has(input:checked) { border-color: var(--accent); background: var(--accent-soft); }
.check input { width: 22px; height: 22px; margin: 0; flex: none; accent-color: var(--accent); cursor: pointer; }
.check span { display: grid; gap: 2px; min-width: 0; }
.check b { font-weight: 600; }
.check small { color: var(--muted); font-family: var(--font-mono); font-size: 12px; }

.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { position: relative; }
.chip input { position: absolute; opacity: 0; inset: 0; cursor: pointer; }
.chip span {
  display: inline-block; padding: 7px 14px; border-radius: 999px; border: 1px solid var(--line);
  font-family: var(--font-mono); font-size: 13px; background: var(--bg); cursor: pointer;
}
.chip input:checked + span { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.custom { display: flex; align-items: center; gap: 6px; font-family: var(--font-mono); font-size: 13px; color: var(--muted); }
.custom input { width: 76px; padding: 6px 10px; font-family: var(--font-mono); font-size: 13px; }

/* Quote summary */
.lines { display: grid; gap: 0; font-variant-numeric: tabular-nums; }
.line { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 12px; padding: 10px 0; border-bottom: 1px dashed var(--line); }
.line .what { min-width: 0; }
.line .sub { display: block; color: var(--muted); font-family: var(--font-mono); font-size: 12px; }
.line .amt { font-family: var(--font-mono); text-align: right; }
.line.discount .amt { color: var(--ok); }
.line.empty { color: var(--muted); }
.total { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; padding-top: 14px; }
.total span:first-child { font-family: var(--font-display); font-weight: 600; font-size: 17px; }
h1 .accent { color: var(--accent); }
.total .big { color: var(--accent); font-family: var(--font-display); font-weight: 700; font-size: 30px; font-variant-numeric: tabular-nums; letter-spacing: -.01em; }

.payouts { background: var(--bg); border: 1px dashed var(--line); border-radius: 10px; padding: 14px 16px 6px; }
.private-note { margin: -4px 0 4px; font-size: 13px; color: var(--muted); }
.payouts .line:last-child { border-bottom: 0; }

.tabs { display: inline-flex; padding: 3px; gap: 3px; background: var(--bg); border: 1px solid var(--line); border-radius: 10px; }
.tabs button {
  font: inherit; font-size: 13.5px; font-weight: 600; border: 0; background: transparent; color: var(--muted);
  padding: 6px 14px; border-radius: 7px; cursor: pointer;
}
.tabs button[aria-selected="true"] { background: var(--panel); color: var(--ink); box-shadow: 0 1px 2px rgb(0 0 0 / .12); }
.msg-head { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; }

pre#message {
  margin: 0; white-space: pre-wrap; word-break: break-word; font-family: var(--font-mono); font-size: 13px; line-height: 1.6;
  background: var(--msg-bg); border: 1px solid var(--line); border-radius: 10px; padding: 16px; max-height: 520px; overflow: auto;
}
.actions { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.btn {
  font: inherit; font-weight: 600; font-size: 14.5px; border-radius: 10px; padding: 11px 18px; cursor: pointer;
  border: 1px solid var(--accent); background: var(--accent); color: var(--accent-ink);
}
.btn.ghost { background: transparent; color: var(--ink); border-color: var(--line); }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.status { font-size: 13px; color: var(--ok); }
.status.warn { color: var(--live); }

@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

</head>

<script>
const RATE = 50;
const BANK = {
  name: "Anthony Omisade",
  bank: "Monzo Bank",
  sort: "04-00-04",
  acct: "35907201"
};
const SIGN_OFF = "Anthony Omisade\nNew Covenant Church Bermondsey – Technical Team";

const $ = id => document.getElementById(id);
let format = "wa";

const gbp = n => "£" + n.toLocaleString("en-GB", { minimumFractionDigits: 2, maximumFractionDigits: 2 });

function minutesOf(t) {
  if (!t) return null;
  const [h, m] = t.split(":").map(Number);
  return h * 60 + m;
}

function fmtTime(t) {
  let [h, m] = t.split(":").map(Number);
  const ap = h >= 12 ? "pm" : "am";
  h = h % 12 || 12;
  return h + ":" + String(m).padStart(2, "0") + ap;
}

function fmtDate(d) {
  if (!d) return "";
  const [y, mo, da] = d.split("-").map(Number);
  return new Date(y, mo - 1, da).toLocaleDateString("en-GB", { weekday: "long", day: "numeric", month: "long", year: "numeric" });
}

function fmtHours(h) {
  const s = Number.isInteger(h) ? String(h) : h.toFixed(2).replace(/0$/, "");
  return s + (h === 1 ? " hour" : " hours");
}

function discountPct() {
  const sel = document.querySelector('input[name="disc"]:checked');
  if (!sel) return 0;
  if (sel.value === "custom") {
    const v = parseFloat($("customDisc").value);
    return isNaN(v) ? 0 : Math.min(100, Math.max(0, v));
  }
  return Number(sel.value);
}

// Pure calculation, so the numbers in the summary and the message always match.
function buildQuote(input) {
  const s = minutesOf(input.start), e = minutesOf(input.end);
  let mins = null, overnight = false;
  if (s !== null && e !== null) {
    mins = e - s;
    if (mins <= 0) { mins += 24 * 60; overnight = true; }
  }
  const hours = mins === null ? 0 : mins / 60;
  const roles = [];
  if (input.sound) roles.push("Sound Engineer");
  if (input.camera) roles.push("Camera Technician");
  const items = roles.map(r => ({ role: r, hours, cost: Math.round(hours * RATE * 100) / 100 }));
  const subtotal = items.reduce((a, i) => a + i.cost, 0);
  const discount = Math.round(subtotal * input.discount) / 100;
  const total = Math.round((subtotal - discount) * 100) / 100;
  // Each person takes the same % off; the last share absorbs any rounding penny so the pay adds up to the total.
  let paid = 0;
  items.forEach((i, n) => {
    i.pay = n === items.length - 1 ? Math.round((total - paid) * 100) / 100 : Math.round(i.cost * (100 - input.discount)) / 100;
    paid += i.pay;
  });
  return { hours, overnight, items, subtotal, discount, total };
}

function readInput() {
  return {
    event: $("eventName").value.trim(),
    client: $("clientName").value.trim(),
    date: $("eventDate").value,
    start: $("startTime").value,
    end: $("endTime").value,
    sound: $("needSound").checked,
    camera: $("needCamera").checked,
    discount: discountPct()
  };
}

function subjectLine(inp) {
  return "Quotation: Technical Team for " + (inp.event || "your event") + (inp.date ? " – " + fmtDate(inp.date) : "");
}

function buildMessage(inp, q) {
  const wa = format === "wa";
  const b = t => wa ? "*" + t + "*" : t;
  const L = [];
  const eventName = inp.event || "your event";

  if (wa) {
    L.push(b("Quotation – NCC Bermondsey Technical Team"), "");
    L.push(inp.client ? "Hi " + inp.client + "," : "Hi,");
    L.push("Thank you for booking the Technical Team. Please find the quotation for " + eventName + " below.", "");
  } else {
    L.push("Subject: " + subjectLine(inp), "");
    L.push(inp.client ? "Dear " + inp.client + "," : "Dear Sir/Madam,", "");
    L.push("Thank you for booking the New Covenant Church Bermondsey Technical Team. Please find our quotation for " + eventName + " below.", "");
    L.push("EVENT DETAILS");
  }

  L.push(b("Event:") + " " + eventName);
  if (inp.date) L.push(b("Date:") + " " + fmtDate(inp.date));
  if (inp.start && inp.end) {
    L.push(b("Time:") + " " + fmtTime(inp.start) + " – " + fmtTime(inp.end) + (q.overnight ? " (next day)" : "") + " (" + fmtHours(q.hours) + ")");
  }
  L.push("");

  L.push(wa ? b("Crew") : "CREW");
  if (q.items.length === 0) {
    L.push("No crew selected");
  } else {
    q.items.forEach(i => {
      L.push((wa ? "• " : "- ") + i.role + ": " + fmtHours(i.hours) + " × " + gbp(RATE) + "/hr = " + gbp(i.cost));
    });
  }
  L.push("");

  if (q.discount > 0) {
    L.push("Subtotal: " + gbp(q.subtotal));
    L.push("Discount (" + inp.discount + "%): −" + gbp(q.discount));
  }
  L.push(b("Total due: " + gbp(q.total)), "");

  L.push(wa ? b("Payment details") : "PAYMENT DETAILS");
  L.push("Account name: " + BANK.name);
  L.push("Bank: " + BANK.bank);
  L.push("Sort code: " + BANK.sort);
  L.push("Account number: " + BANK.acct);
  L.push("Reference: " + (inp.event ? inp.event.slice(0, 18) : "Event name"), "");

  L.push(wa ? "Any questions, just let me know. God bless!" : "If you have any questions, please don't hesitate to get in touch.", "");
  L.push(wa ? "Anthony" : "Kind regards,\n" + SIGN_OFF);
  return L.join("\n");
}

function render() {
  const inp = readInput();
  const q = buildQuote(inp);
  $("customWrap").hidden = !$("dCustom").checked;

  const err = $("timeErr");
  if (inp.start && inp.end && minutesOf(inp.end) <= minutesOf(inp.start)) {
    err.hidden = false;
    err.textContent = "Finish time is earlier than start, so it's counted as finishing the next day (" + fmtHours(q.hours) + ").";
  } else {
    err.hidden = true;
  }

  const lines = $("lines");
  lines.innerHTML = "";
  const add = (what, sub, amt, cls) => {
    const d = document.createElement("div");
    d.className = "line" + (cls ? " " + cls : "");
    const w = document.createElement("div"); w.className = "what"; w.textContent = what;
    if (sub) { const s = document.createElement("span"); s.className = "sub"; s.textContent = sub; w.appendChild(s); }
    const a = document.createElement("div"); a.className = "amt"; a.textContent = amt;
    d.append(w, a); lines.appendChild(d);
  };
  if (q.items.length === 0) add("Tick at least one crew role", "", "—", "empty");
  q.items.forEach(i => add(i.role, fmtHours(i.hours) + " × " + gbp(RATE), gbp(i.cost)));
  if (q.discount > 0) {
    add("Subtotal", "", gbp(q.subtotal));
    add("Discount", inp.discount + "% off", "−" + gbp(q.discount), "discount");
  }
  $("total").textContent = gbp(q.total);

  const payouts = $("payouts");
  payouts.innerHTML = "";
  if (q.items.length === 0) {
    const d = document.createElement("div");
    d.className = "line empty";
    d.textContent = "Tick a crew role to see what they're paid";
    payouts.appendChild(d);
  }
  q.items.forEach(i => {
    const d = document.createElement("div"); d.className = "line";
    const w = document.createElement("div"); w.className = "what"; w.textContent = i.role;
    const s = document.createElement("span"); s.className = "sub";
    s.textContent = q.discount > 0 ? gbp(i.cost) + " less " + inp.discount + "%" : "No discount applied";
    w.appendChild(s);
    const a = document.createElement("div"); a.className = "amt"; a.textContent = gbp(i.pay);
    d.append(w, a); payouts.appendChild(d);
  });

  $("message").textContent = buildMessage(inp, q);
  $("copySubject").hidden = format !== "email";
  $("copyBtn").textContent = format === "wa" ? "Copy WhatsApp message" : "Copy email";
  $("status").textContent = "";
}

function selectText(el) {
  const r = document.createRange(); r.selectNodeContents(el);
  const s = getSelection(); s.removeAllRanges(); s.addRange(r);
}

function copy(text, label) {
  const st = $("status");
  st.classList.remove("warn");
  const done = () => { st.textContent = label + " copied"; };
  const fail = () => {
    selectText($("message"));
    st.classList.add("warn");
    st.textContent = "Couldn't copy automatically. The text is selected, press Ctrl/Cmd+C.";
  };
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(done, fail);
  } else fail();
}

$("form").addEventListener("input", render);
$("form").addEventListener("change", render);
$("form").addEventListener("submit", e => e.preventDefault());

$("tabWa").addEventListener("click", () => { format = "wa"; $("tabWa").setAttribute("aria-selected", "true"); $("tabEmail").setAttribute("aria-selected", "false"); render(); });
$("tabEmail").addEventListener("click", () => { format = "email"; $("tabEmail").setAttribute("aria-selected", "true"); $("tabWa").setAttribute("aria-selected", "false"); render(); });

$("copyBtn").addEventListener("click", () => {
  let text = $("message").textContent;
  // For email, the subject goes in the subject box, so copy just the body.
  if (format === "email") text = text.replace(/^Subject: .*\n\n/, "");
  copy(text, format === "wa" ? "WhatsApp message" : "Email");
});
$("copySubject").addEventListener("click", () => copy(subjectLine(readInput()), "Subject line"));

$("clearBtn").addEventListener("click", () => {
  ["eventName", "clientName", "eventDate", "startTime", "endTime"].forEach(id => $(id).value = "");
  $("needSound").checked = false; $("needCamera").checked = false;
  $("d0").checked = true;
  render();
  $("eventName").focus();
});

render();
</script>
</body>
</html>
